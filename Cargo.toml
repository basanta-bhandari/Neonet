[package]
name = "neonet"
version = "0.1.0"
edition = "2021"
description = "NeoNet v1 reference implementation"
license-file = "LICENSE-PLACEHOLDER"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
blake3 = "1.5"
hex = "0.4"
tokio = { version = "1.39", features = ["full"] }
postcard = { version = "1.0", features = ["alloc"] }
chacha20poly1305 = "0.10"
serde-big-array = "0.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.12"
